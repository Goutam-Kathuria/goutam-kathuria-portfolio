<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif"><text x="92" y="96" fill="#dfff55" font-size="18" letter-spacing="5">AI-ASSISTED RESPONSE / EXAMPLE</text><text x="92" y="164" fill="#f5f5ed" font-size="55" font-weight="700">From raw input to a useful reply.</text><text x="94" y="206" fill="#9aa296" font-size="21">A review-response flow, shown as a concept—not a customer dashboard.</text>
