<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111412"/><stop offset="1" stop-color="#1b1725"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6ff72"/><stop offset="1" stop-color="#a6e34b"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a995ff"/><stop offset="1" stop-color="#7c67f6"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#edf2e9" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrowLime" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#dfff55"/></marker>
  <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a995ff"/></marker>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
<circle cx="1270" cy="110" r="270" fill="#9a7cff" opacity=".055"/><circle cx="270" cy="900" r="290" fill="#dfff55" opacity=".04"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="96" y="92" fill="#dfff55" font-size="18" letter-spacing="5">AUTOMATION / WORKFLOW MAP</text>
  <text x="96" y="158" fill="#f6f5ee" font-size="56" font-weight="700" letter-spacing="-2">From event to response.</text>
  <text x="98" y="198" fill="#9ba196" font-size="21">A representative flow connecting APIs, AI services and communication tools.</text>
  <path d="M120 470H1480" stroke="#7f8479" stroke-opacity=".25" stroke-width="2" stroke-dasharray="5 12"/>
  <path d="M338 470H386" stroke="#dfff55" stroke-width="3" marker-end="url(#arrowLime)"/><path d="M618 470H666" stroke="#a995ff" stroke-width="3" marker-end="url(#arrowViolet)"/><path d="M898 470H946" stroke="#dfff55" stroke-width="3" marker-end="url(#arrowLime)"/><path d="M1178 470H1226" stroke="#a995ff" stroke-width="3" marker-end="url(#arrowViolet)"/>
  <g transform="translate(96 350)"><rect width="242" height="240" rx="18" fill="#181d19" stroke="#dfff55" stroke-opacity=".65" stroke-width="2"/><rect x="20" y="20" width="46" height="46" rx="13" fill="url(#lime)"/><path d="M43 29L33 45H42L38 58L53 40H44L49 29Z" fill="#151914"/><text x="22" y="102" font-size="15" fill="#dfff55" letter-spacing="2">01 / TRIGGER</text><text x="22" y="142" font-size="26" fill="#f5f5ed" font-weight="700">New event</text><text x="22" y="174" font-size="17" fill="#9ca499">Review, form or</text><text x="22" y="198" font-size="17" fill="#9ca499">business activity</text></g>
  <g transform="translate(376 350)"><rect width="242" height="240" rx="18" fill="#18191f" stroke="#a995ff" stroke-opacity=".7" stroke-width="2"/><rect x="20" y="20" width="46" height="46" rx="13" fill="url(#violet)"/><path d="M30 43H56M43 30V56" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="22" y="102" font-size="15" fill="#b5a7ff" letter-spacing="2">02 / WEBHOOK</text><text x="22" y="142" font-size="26" fill="#f5f5ed" font-weight="700">Validate input</text><text x="22" y="174" font-size="17" fill="#9ca499">Read event data</text><text x="22" y="198" font-size="17" fill="#9ca499">and route it</text></g>
  <g transform="translate(656 350)"><rect width="242" height="240" rx="18" fill="#181d19" stroke="#dfff55" stroke-opacity=".65" stroke-width="2"/><rect x="20" y="20" width="46" height="46" rx="13" fill="url(#lime)"/><path d="M43 28L47 39L58 43L47 47L43 58L39 47L28 43L39 39Z" fill="#151914"/><text x="22" y="102" font-size="15" fill="#dfff55" letter-spacing="2">03 / AI SERVICE</text><text x="22" y="142" font-size="26" fill="#f5f5ed" font-weight="700">Draft response</text><text x="22" y="174" font-size="17" fill="#9ca499">Gemini or local</text><text x="22" y="198" font-size="17" fill="#9ca499">Ollama model</text></g>
  <g transform="translate(936 350)"><rect width="242" height="240" rx="18" fill="#18191f" stroke="#a995ff" stroke-opacity=".7" stroke-width="2"/><rect x="20" y="20" width="46" height="46" rx="13" fill="url(#violet)"/><path d="M30 33H56V52H30ZM35 39H51M35 45H47" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="22" y="102" font-size="15" fill="#b5a7ff" letter-spacing="2">04 / CONNECT</text><text x="22" y="142" font-size="26" fill="#f5f5ed" font-weight="700">Send or queue</text><text x="22" y="174" font-size="17" fill="#9ca499">WhatsApp or</text><text x="22" y="198" font-size="17" fill="#9ca499">connected API</text></g>
  <g transform="translate(1216 350)"><rect width="242" height="240" rx="18" fill="#181d19" stroke="#dfff55" stroke-opacity=".65" stroke-width="2"/><rect x="20" y="20" width="46" height="46" rx="13" fill="url(#lime)"/><path d="M32 44L40 52L55 34" fill="none" stroke="#151914" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="102" font-size="15" fill="#dfff55" letter-spacing="2">05 / RESULT</text><text x="22" y="142" font-size="26" fill="#f5f5ed" font-weight="700">Record outcome</text><text x="22" y="174" font-size="17" fill="#9ca499">Return status to</text><text x="22" y="198" font-size="17" fill="#9ca499">the workflow</text></g>
  <path d="M96 680H1504" stroke="#f6f5ee" stroke-opacity=".14"/><text x="96" y="732" fill="#8d9489" font-size="17" letter-spacing="2">WEBHOOKS</text><text x="310" y="732" fill="#8d9489" font-size="17" letter-spacing="2">API INTEGRATIONS</text><text x="625" y="732" fill="#8d9489" font-size="17" letter-spacing="2">AI-ASSISTED TEXT</text><text x="900" y="732" fill="#8d9489" font-size="17" letter-spacing="2">MESSAGING</text><text x="1160" y="732" fill="#8d9489" font-size="17" letter-spacing="2">WORKFLOW STATUS</text>
  <text x="96" y="900" fill="#dfff55" font-size="14" letter-spacing="4">GOUTAM KATHURIA / AUTOMATION EXAMPLES</text><text x="1504" y="900" text-anchor="end" fill="#687064" font-size="14" letter-spacing="3">ILLUSTRATIVE FLOW · NO CUSTOMER DATA</text>
</g></svg>